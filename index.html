<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُخمّن الألوان السحري - لعبة تحدي الألوان</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <header>
            <h1>مُخمّن الألوان السحري</h1>
            <p>اختبر سرعة بديهتك وتمييزك للألوان!</p>
        </header>

        <div class="score-board">
            <span>النقاط: <span id="score">0</span></span>
            <div class="timer-container">
                <div id="timer-bar"></div>
            </div>
            <span id="timer-text">10</span>
        </div>

        <div id="main-color-box" class="color-box">
            <p>اللون المطلوب:</p>
            <h2 id="main-color-name" style="color: white; text-shadow: 1px 1px 2px black;"></h2>
        </div>

        <div class="options-container">
            <div class="option-box color-box" id="opt-1"></div>
            <div class="option-box color-box" id="opt-2"></div>
            <div class="option-box color-box" id="opt-3"></div>
            <div class="option-box color-box" id="opt-4"></div>
        </div>

        <button id="start-btn">ابدأ التحدي</button>
        <p id="feedback-message"></p>

    </div>

    <script src="script.js"></script>
</body>
</html>
