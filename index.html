<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MW3 // TACTICAL MAP PROTOCOL</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --mw-bg: #0a0d12;
            --mw-panel: #131822;
            --mw-red: #ea580c; /* برتقالي/احمر كود */
            --mw-accent: #38bdf8;
            --mw-text: #f1f5f9;
            --mw-muted: #64748b;
            --mw-border: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--mw-bg);
            color: var(--mw-text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow: hidden;
        }

        .mw-wrapper {
            width: 100%;
            max-width: 600px;
            background-color: var(--mw-panel);
            border: 2px solid var(--mw-border);
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            position: relative;
        }

        /* شريط عسكري علوي */
        .mw-top-bar {
            background: #07090e;
            padding: 12px 20px;
            border-bottom: 2px solid var(--mw-red);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mw-title {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: var(--mw-text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mw-title span {
            color: var(--mw-red);
        }

        .mw-status {
            font-size: 0.85rem;
            color: var(--mw-accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* شاشات اللعبة */
        .screen {
            display: none;
            padding: 25px;
            min-height: 420px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .screen.active {
            display: flex;
        }

        /* القائمة الرئيسية */
        .lobby-box {
            text-align: center;
            width: 100%;
        }

        .lobby-box h2 {
            font-size: 2rem;
            letter-spacing: 3px;
            margin-bottom: 10px;
            color: #fff;
        }

        .lobby-box p {
            color: var(--mw-muted);
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .mw-btn {
            background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            width: 100%;
            box-shadow: 0 4px 15px rgba(234, 88, 12, 0.4);
            text-transform: uppercase;
        }

        .mw-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* الماب التكتيكي (ساحة المعركة) */
        .tactical-hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 15px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: rgba(0,0,0,0.3);
            padding: 8px 15px;
            border-radius: 4px;
            border-left: 4px solid var(--mw-red);
        }

        .tactical-map-grid {
            width: 100%;
            height: 240px;
            background: #090d16;
            border: 1px solid var(--mw-border);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            cursor: crosshair;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* شبكة الرادار الحربية الخلفية */
        .tactical-map-grid::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .target-enemy {
            width: 60px;
            height: 60px;
            background: rgba(234, 88, 12, 0.2);
            border: 2px solid var(--mw-red);
            border-radius: 50%;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            animation: pulseEnemy 1.5s infinite;
        }

        .target-enemy::after {
            content: '';
            width: 12px;
            height: 12px;
            background: var(--mw-red);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--mw-red);
        }

        @keyframes pulseEnemy {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(234, 88, 12, 0.4); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(234, 88, 12, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(234, 88, 12, 0); }
        }

        .mw-instructions {
            margin-top: 15px;
            text-align: center;
            color: var(--mw-muted);
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* شاشة النهاية / التقرير التكتيكي */
        .after-action-report {
            text-align: center;
            width: 100%;
        }

        .after-action-report h2 {
            font-size: 1.8rem;
            color: var(--mw-red);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .stats-box {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--mw-border);
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 1.1rem;
        }

        .stats-row:last-child {
            border-bottom: none;
        }

        .stats-row span:last-child {
            color: var(--mw-accent);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="mw-wrapper">
        <!-- شريط الهيدر الحربي -->
        <div class="mw-top-bar">
            <div class="mw-title">MW3 // <span>TACTICAL MAP</span></div>
            <div class="mw-status" id="net-status">ONLINE [SECURE]</div>
        </div>

        <!-- 1. القائمة الرئيسية (Lobby) -->
        <div id="lobby-screen" class="screen active">
            <div class="lobby-box">
                <h2>OPERATION: OVERLOAD</h2>
                <p>ماب التكتيك السريع - نمط الاشتباك المباشر</p>
                <button class="mw-btn" id="start-mission-btn">نشر القوات (DEPLOY)</button>
            </div>
        </div>

        <!-- 2. ماب الاشتباك التكتيكي (In-Game Map) -->
        <div id="game-screen" class="screen">
            <div class="tactical-hud">
                <span>النقاط: <span id="score-val" style="color:var(--mw-red);">0</span></span>
                <span>الزمن المتبقي: <span id="timer-val" style="color:var(--mw-accent);">15</span> ثانية</span>
            </div>

            <div class="tactical-map-grid" id="map-grid">
                <!-- الأهداف تظهر هنا برمجياً -->
            </div>

            <div class="mw-instructions">تخلص من الأهداف المعادية بأسرع وقت قبل انتهاء المهلة!</div>
        </div>

        <!-- 3. تقرير نهاية المهمة (After Action Report) -->
        <div id="report-screen" class="screen">
            <div class="after-action-report">
                <h2>MISSION ACCOMPLISHED</h2>
                <p>تم إغلاق الخريطة وتأمين القطاع بنجاح.</p>
                
                <div class="stats-box">
                    <div class="stats-row">
                        <span>الأهداف المُحטרقة:</span>
                        <span id="final-score">0</span>
                    </div>
                    <div class="stats-row">
                        <span>كفاءة الاشتباك:</span>
                        <span id="accuracy-val">100%</span>
                    </div>
                </div>

                <button class="mw-btn" id="redeploy-btn">إعادة النشر (RE-DEPLOY)</button>
            </div>
        </div>
    </div>

    <script>
        const screens = {
            lobby: document.getElementById('lobby-screen'),
            game: document.getElementById('game-screen'),
            report: document.getElementById('report-screen')
        };

        const startBtn = document.getElementById('start-mission-btn');
        const redeployBtn = document.getElementById('redeploy-btn');
        const mapGrid = document.getElementById('map-grid');
        const scoreVal = document.getElementById('score-val');
        const timerVal = document.getElementById('timer-val');
        const finalScore = document.getElementById('final-score');

        let score = 0;
        let timeLeft = 15;
        let gameTimer = null;
        let enemySpawnTimer = null;

        function switchScreen(name) {
            Object.keys(screens).forEach(k => {
                screens[k].classList.toggle('active', k === name);
            });
        }

        function startMission() {
            score = 0;
            timeLeft = 15;
            scoreVal.textContent = score;
            timerVal.textContent = timeLeft;
            switchScreen('game');
            spawnEnemy();

            gameTimer = setInterval(() => {
                timeLeft--;
                timerVal.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endMission();
                }
            }, 1000);
        }

        function spawnEnemy() {
            if (screens.game.classList.contains('active')) {
                mapGrid.innerHTML = '';
                const enemy = document.createElement('div');
                enemy.className = 'target-enemy';
                
                // مواقع عشوائية داخل الماب المصغر
                const maxX = mapGrid.clientWidth - 70;
                const maxY = mapGrid.clientHeight - 70;
                const randomX = Math.floor(Math.random() * Math.max(10, maxX));
                const randomY = Math.floor(Math.random() * Math.max(10, maxY));

                enemy.style.left = randomX + 'px';
                enemy.style.top = randomY + 'px';

                enemy.onclick = () => {
                    score += 100;
                    scoreVal.textContent = score;
                    spawnEnemy(); // ظهور هدف جديد فوراً عند القضاء على الحالي
                };

                mapGrid.appendChild(enemy);
            }
        }

        function endMission() {
            clearInterval(gameTimer);
            mapGrid.innerHTML = '';
            finalScore.textContent = score;
            switchScreen('report');
        }

        startBtn.onclick = startMission;
        redeployBtn.onclick = startMission;
    </script>
</body>
</html>
