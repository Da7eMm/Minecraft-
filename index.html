<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>عيد ميلاد سعيد!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e1e2f, #2d1b4e);
            font-family: 'Tahoma', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 500px;
            animation: bounce 2s infinite alternate;
        }
        h1 {
            color: #ffcc00;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }
        p {
            font-size: 1.2em;
            line-height: 1.6;
            color: #e0e0e0;
        }
        .cake {
            font-size: 60px;
            margin: 20px 0;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="cake">🎂🎉</div>
        <h1>كل عام وأنت بألف خير!</h1>
        <p>إلى أقرب الناس إلى قلبي، أتمنى لك سنة مليئة بالسعادة، النجاح، وتحقيق كل ما تتمناه. عسى أن تكون أيامك كلها أعياد وفرح!</p>
        <p style="margin-top: 20px; color: #ff7675; font-weight: bold;">عيد ميلاد سعيد 🎈</p>
    </div>

</body>
</html>
