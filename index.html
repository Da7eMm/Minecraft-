<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MW3 // MINI-OPS</title>
    <style>
        :root { --bg: #030712; --mw-red: #ea580c; --mw-blue: #38bdf8; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Rajdhani', sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        #game-view { flex: 1; position: relative; background: radial-gradient(circle, #1e293b, #030712); cursor: crosshair; }
        
        /* الشخصية */
        #operator { width: 40px; height: 40px; background: var(--mw-blue); position: absolute; bottom: 20px; left: 50%; border-radius: 4px; z-index: 2; border: 2px solid white; }
        
        /* الأعداء */
        .enemy { width: 35px; height: 35px; background: var(--mw-red); position: absolute; border-radius: 50%; z-index: 1; transition: top 0.1s linear; }
        
        /* الواجهة (HUD) */
        .hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: bold; padding: 10px; background: rgba(0,0,0,0.5); border-left: 4px solid var(--mw-red); }
        
        /* الكنترول */
        .controls { height: 120px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; padding: 10px; background: #111827; }
        button { background: #1e293b; color: white; border: none; font-size: 1.2rem; border-radius: 8px; }
        .fire { background: var(--mw-red); font-size: 1.5rem; }
    </style>
</head>
<body>

<div id="game-view">
    <div class="hud">
        <span>SCORE: <span id="score">0</span></span>
        <span>MW3-MINI-OPS</span>
    </div>
    <div id="operator"></div>
</div>

<div class="controls">
    <button onpointerdown="move(-20)">◀</button>
    <button class="fire" onpointerdown="shoot()">FIRE</button>
    <button onpointerdown="move(20)">▶</button>
</div>

<script>
    let pos = window.innerWidth / 2;
    const operator = document.getElementById('operator');
    const view = document.getElementById('game-view');
    let score = 0;

    function move(d) { pos += d; operator.style.left = pos + 'px'; }

    function shoot() {
        const bullet = document.createElement('div');
        bullet.style.cssText = `position:absolute; bottom:60px; left:${pos+18}px; width:4px; height:20px; background:yellow;`;
        view.appendChild(bullet);
        
        let bY = 60;
        let int = setInterval(() => {
            bY += 20;
            bullet.style.bottom = bY + 'px';
            
            // إصابة الأعداء
            document.querySelectorAll('.enemy').forEach(e => {
                if(Math.abs(e.offsetLeft - bullet.offsetLeft) < 30 && (view.clientHeight - bY) < e.offsetTop + 35) {
                    e.remove(); bullet.remove(); clearInterval(int);
                    score += 100; document.getElementById('score').innerText = score;
                }
            });
            if(bY > view.clientHeight) { bullet.remove(); clearInterval(int); }
        }, 30);
    }

    // نظام الأعداء (AI)
    setInterval(() => {
        const e = document.createElement('div');
        e.className = 'enemy';
        e.style.left = Math.random() * (window.innerWidth - 40) + 'px';
        e.style.top = '0px';
        view.appendChild(e);
        
        let t = 0;
        let moveInt = setInterval(() => {
            t += 3; e.style.top = t + 'px';
            if(t > view.clientHeight) { e.remove(); clearInterval(moveInt); }
        }, 30);
    }, 1000);
</script>
</body>
</html>
