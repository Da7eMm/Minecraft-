<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الإلكتروني</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
        }
        header {
            background: #ffffff;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eaeaea;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #111;
        }
        .hero {
            text-align: center;
            padding: 60px 20px;
            background: #ffffff;
            margin-bottom: 30px;
        }
        .hero h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #111;
        }
        .hero p {
            color: #666;
            font-size: 18px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding-bottom: 60px;
        }
        .product-card {
            background: #ffffff;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .product-img {
            width: 100%;
            height: 200px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
        }
        .product-info {
            padding: 20px;
        }
        .product-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #222;
        }
        .product-price {
            color: #0071e3;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .buy-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #111;
            color: #fff;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .buy-btn:hover {
            background: #333;
        }
        footer {
            text-align: center;
            padding: 30px;
            background: #ffffff;
            border-top: 1px solid #eaeaea;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">متجري الجديد 🚀</div>
    </header>

    <section class="hero">
        <h1>أهلاً بك في واجهتنا الأولى</h1>
        <p>منتجات مميزة، بتصميم نظيف وسريع على GitHub Pages</p>
    </section>

    <div class="container">
        <div class="products-grid">
            
            <!-- منتج 1 -->
            <div class="product-card">
                <div class="product-img">صورة المنتج 1</div>
                <div class="product-info">
                    <div class="product-title">اسم المنتج الأول</div>
                    <div class="product-price">٩٩ ر.س</div>
                    <!-- حط رابط الواتساب حقك هنا مع رسالة جاهزة -->
                    <a href="https://wa.me/966500000000?text=أرغب%20في%20طلب%20المنتج%20الأول" class="buy-btn" target="_blank">اطلب عبر واتساب</a>
                </div>
            </div>

            <!-- منتج 2 -->
            <div class="product-card">
                <div class="product-img">صورة المنتج 2</div>
                <div class="product-info">
                    <div class="product-title">اسم المنتج الثاني</div>
                    <div class="product-price">١٤٩ ر.س</div>
                    <a href="https://wa.me/966500000000?text=أرغب%20في%20طلب%20المنتج%20الثاني" class="buy-btn" target="_blank">اطلب عبر واتساب</a>
                </div>
            </div>

            <!-- منتج 3 -->
            <div class="product-card">
                <div class="product-img">صورة المنتج 3</div>
                <div class="product-info">
                    <div class="product-title">اسم المنتج الثالث</div>
                    <div class="product-price">١٩٩ ر.س</div>
                    <a href="https://wa.me/966500000000?text=أرغب%20في%20طلب%20المنتج%20الثالث" class="buy-btn" target="_blank">اطلب عبر واتساب</a>
                </div>
            </div>

        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة &copy; 2026
    </footer>

</body>
</html>
