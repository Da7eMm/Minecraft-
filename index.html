<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحدي الألوان الاحترافي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; }
        .app-wrapper { width: 100%; max-width: 450px; background-color: var(--bg-card); border-radius: 16px; border: 1px solid var(--border-color); overflow: hidden; padding: 20px; }
        h1 { text-align: center; font-size: 1.2rem; margin-bottom: 15px; }
        .stats { display: flex; justify-content: space-around; background: #0f172a; padding: 10px; border-radius: 10px; margin-bottom: 20px; font-size: 0.9rem; }
        
        /* نظام إخفاء الشاشات بقوة */
        .screen { display: none !important; }
        .screen.active { display: flex !important; flex-direction: column; align-items: center; gap: 15px; }

        .target-box { width: 100%; height: 100px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 1.1rem; font-weight: bold; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.2); }
        .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; margin-top: 10px; }
        .option-card { height: 85px; border-radius: 12px; cursor: pointer; border: 2px solid var(--border-color); }
        .primary-btn { background-color: var(--accent); color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .timer-bar { width: 100%; height: 6px; background: var(--border-color); border-radius: 3px; overflow: hidden; }
        .timer-fill { height: 100%; background: var(--success); width: 100%; }
        p { text-align: center; color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <h1>✨ مُخمّن الألوان الاحترافي</h1>
        
        <div class="stats">
            <span>النقاط: <strong id="score">0</strong></span>
            <span>المستوى: <strong id="level">1</strong></span>
            <span>الأرواح: <strong id="lives">❤️❤️❤️</strong></span>
        </div>

        <!-- شاشة البداية -->
        <div id="start-screen" class="screen active">
            <p>طابق اللون المستهدف مع الخيارات الصحيحة بأسرع وقت ممكن قبل نفاد المحاولات!</p>
            <button id="start-btn" class="primary-btn">بدء التحدي</button>
        </div>

        <!-- شاشة اللعب -->
        <div id="play-screen" class="screen">
            <div class="timer-bar"><div id="timer-fill" class="timer-fill"></div></div>
            <p>طابق هذا اللون:</p>
            <div id="target-box" class="target-box">#000000</div>
            <div id="options-grid" class="options-grid"></div>
        </div>

        <!-- شاشة النهاية -->
        <div id="game-over-screen" class="screen">
            <h2>انتهت اللعبة! 🎮</h2>
            <p>نتيجتك النهائية:</p>
            <h3 id="final-score" style="color: var(--accent); font-size: 1.8rem;">0</h3>
            <button id="restart-btn" class="primary-btn">العب مرة أخرى</button>
        </div>
    </div>

    <script>
        const screens = {
            start: document.getElementById('start-screen'),
            play: document.getElementById('play-screen'),
            gameOver: document.getElementById('game-over-screen')
        };
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const livesEl = document.getElementById('lives');
        const targetBox = document.getElementById('target-box');
        const optionsGrid = document.getElementById('options-grid');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const finalScore = document.getElementById('final-score');
        const timerFill = document.getElementById('timer-fill');

        let score = 0, level = 1, lives = 3, targetColor = '', timer, timeLeft = 100;

        function showScreen(name) {
            Object.keys(screens).forEach(k => {
                screens[k].classList.toggle('active', k === name);
            });
        }

        function randomColor() {
            return '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0').toUpperCase();
        }

        function startGame() {
            score = 0;
            level = 1;
            lives = 3;
            updateStats();
            showScreen('play');
            nextRound();
        }

        function updateStats() {
            scoreEl.textContent = score;
            levelEl.textContent = level;
            livesEl.textContent = '❤️'.repeat(lives);
        }

        function nextRound() {
            clearInterval(timer);
            targetColor = randomColor();
            targetBox.style.backgroundColor = targetColor;
            targetBox.textContent = targetColor;

            let correctIdx = Math.floor(Math.random() * 4);
            let options = [];
            for (let i = 0; i < 4; i++) {
                options.push(i === correctIdx ? targetColor : randomColor());
            }

            optionsGrid.innerHTML = '';
            options.forEach(col => {
                const card = document.createElement('div');
                card.className = 'option-card';
                card.style.backgroundColor = col;
                card.onclick = () => checkAnswer(col);
                optionsGrid.appendChild(card);
            });

            startTimer();
        }

        function checkAnswer(col) {
            clearInterval(timer);
            if (col === targetColor) {
                score += 10 + level * 2;
                level++;
                updateStats();
                nextRound();
            } else {
                lives--;
                updateStats();
                if (lives <= 0) {
                    finalScore.textContent = score;
                    showScreen('gameOver');
                } else {
                    nextRound();
                }
            }
        }

        function startTimer() {
            timeLeft = 100;
            timer = setInterval(() => {
                timeLeft -= 1.5;
                timerFill.style.width = timeLeft + '%';
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    lives--;
                    updateStats();
                    if (lives <= 0) {
                        finalScore.textContent = score;
                        showScreen('gameOver');
                    } else {
                        nextRound();
                    }
                }
            }, 100);
        }

        startBtn.onclick = startGame;
        restartBtn.onclick = startGame;
    </script>
</body>
</html>
